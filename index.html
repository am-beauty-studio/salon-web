<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="theme-color" content="#FDF7F9" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <title>AM Luxury Beauty Salon</title>
  <link rel="icon" type="image/png" href="img/logo.png" />
  <link rel="stylesheet" href="css/estilos.css?v=135" />
  <style>
    /* Mínimo crítico: si el CSS tarda, la pantalla de bienvenida igual cubre
       todo y nunca se ve la página en blanco. */
    html, body { background: #FDF7F9; }
    .despertar {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head> 
<body>
  <!-- Pantalla de bienvenida: se ve desde el primer instante, también mientras
       Render despierta. La oculta app.js cuando la primera vista está lista. -->
  <div id="despertar" class="despertar" role="status" aria-live="polite">
    <div class="despertar-caja">
      <img class="despertar-logo" src="img/logo.png" alt="AM Luxury Beauty Salon" />
      <div class="despertar-marca">AM LUXURY</div>
      <div class="despertar-sub">Beauty Studio</div>
      <div class="despertar-pista" aria-hidden="true">
        <div id="despertar-barra" class="despertar-barra"></div>
      </div>
      <p id="despertar-msg" class="despertar-msg">Conectando con el servidor…</p>
      <div id="despertar-seg" class="despertar-seg">0 s</div>
    </div>
  </div>

  <div id="espera" class="espera oculto">
    <div class="espera-caja">
      <div class="espera-anillo"></div>
      <p class="espera-msg" id="espera-msg">Cargando…</p>
    </div>
  </div>

  <div id="aviso-zona" class="aviso-zona"></div>

  <header id="cabecera" class="cabecera oculto">
    <div class="cabecera-inner">
      <a class="marca" href="#/agenda">
        <img src="img/logo.png" alt="AM Luxury" class="marca-logo" />
        <span class="marca-txt">AM LUXURY</span>
      </a>
      <nav id="nav-chips" class="nav-chips"></nav>
      <span id="chip-usuario" class="chip-usuario" title="Sesión iniciada">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true">
          <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
        </svg>
        <span id="usuario-nombre"></span>
      </span>
      <button id="btn-salir" class="btn-salir" type="button">Salir</button>
    </div>
  </header>

  <main id="app" class="app"></main>

  <!-- Acciones rápidas: fija abajo, tipo dock en PC y barra completa en móvil. -->
  <nav id="menu-inferior" class="menu-inferior oculto" aria-label="Acciones rápidas"></nav>

  <div id="modal-zona"></div>

  <script type="module" src="js/app.js?v=149"></script>
  <script>
   if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
